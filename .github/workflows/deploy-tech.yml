name: Deploy approved TECH release
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Optional approved full source SHA; otherwise use release.json"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["release.json", "clea7-demo/**", "scripts/build_tech.py", "scripts/test_clea7_demo.cjs"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tech-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
      - name: Validate approved source revision
        id: source
        env:
          MANUAL_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          release = json.load(open("release.json"))
          assert release["source_repository"] == "omer87h-ctrl/brzoilokalno-website"
          commit = os.environ.get("MANUAL_SOURCE_COMMIT") or release["source_commit"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit), "An approved full SHA is required"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("commit=" + commit + "\n")
          PYCODE
      - name: Checkout approved TECH source
        uses: actions/checkout@v4
        with:
          repository: omer87h-ctrl/brzoilokalno-website
          ref: ${{ steps.source.outputs.commit }}
          path: upstream
          persist-credentials: false
          sparse-checkout: tech
      - name: Build independent TECH website
        run: python3 scripts/build_tech.py
      - name: Set up Node for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real browser previews and exports before publication
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/tez-qa --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site > /tmp/tech-qa-http.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" || true' EXIT
          export TEZ_CHROME="$(command -v google-chrome)"
          node scripts/test_workspace.cjs
          node scripts/test_visits.cjs
          node scripts/smoke_tech.cjs
          node scripts/test_content.cjs
          TECH_AUDIT_ORIGIN=http://127.0.0.1:4173 TECH_AUDIT_COMPACT=1 TECH_AUDIT_ENFORCE=1 node scripts/portal-audit.cjs
      - name: Verify standalone CLEA7 demo in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clea7-demo-qa
          cp -R _site/clea7-demo /tmp/clea7-demo-qa/web
          cp scripts/test_clea7_demo.cjs /tmp/clea7-demo-qa/test.cjs
          npm install --prefix /tmp/clea7-qa --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/clea7-demo-qa/web > /tmp/clea7-demo-http.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" || true' EXIT
          cd /tmp/clea7-demo-qa
          CLEA7_CHROME="$(command -v google-chrome)" node test.cjs
      - name: Preserve CLEA7 demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clea7-demo-browser-evidence
          path: /tmp/clea7-demo-qa/test-evidence/
          retention-days: 14
      - name: Preserve whole portal regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-whole-portal-regression
          path: portal-audit-output/
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified TECH output
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm public release and main-platform availability
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            curl --fail --silent --show-error --max-time 20 "https://tech.brzoilokalno.com/environment-zero-to-one/resources.html?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-library.html || true
            if test -f /tmp/tech-live-library.html && grep -Fq 'resources-data.js' /tmp/tech-live-library.html; then break; fi
            sleep 5
          done
          grep -Fq 'Tech Environment Zero to One' /tmp/tech-live-library.html
          grep -Fq 'resources-data.js' /tmp/tech-live-library.html
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/environment-zero-to-one/core.js?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-core.js
          grep -Fq 'projectPanel' /tmp/tech-live-core.js
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-home.html
          grep -Fq '<strong>TECH<br>ENVIRONMENT<br><em>ZERO TO ONE</em></strong>' /tmp/tech-live-home.html
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/tech-x/?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-legacy.html
          grep -Fq 'location.replace("/environment-zero-to-one/"' /tmp/tech-live-legacy.html
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/environment-zero-to-one/?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-center.html
          grep -Fq '<strong>TECH ENVIRONMENT<br>ZERO TO ONE</strong>' /tmp/tech-live-center.html
          if grep -Eq 'TECH[[:space:]]*/[[:space:]]*X' /tmp/tech-live-center.html; then exit 1; fi
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/application-data.js?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-applications.js
          grep -Fq 'CV, dokument i poslovna ponuda' /tmp/tech-live-applications.js
          grep -Fq '/visits.js?v=' /tmp/tech-live-home.html
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/visits.js?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-visits.js
          grep -Fq 'portal-2026-10-12.svg' /tmp/tech-live-visits.js
          grep -Fq 'globalPrivacyControl' /tmp/tech-live-visits.js
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/environment-zero-to-one/moji-radovi.html?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-workspace.html
          grep -Fq 'works-backup' /tmp/tech-live-workspace.html
          curl --fail --silent --show-error --max-time 25 "https://tech.brzoilokalno.com/environment-zero-to-one/vizuelni-studio.html?release=${{ steps.source.outputs.commit }}" -o /tmp/tech-live-builder.html
          grep -Fq 'visual-onboarding-form' /tmp/tech-live-builder.html
          curl --fail --silent --show-error --max-time 25 https://tech.brzoilokalno.com/clea7-demo/ -o /tmp/clea7-demo-live.html
          grep -Fq 'BL CLEA7' /tmp/clea7-demo-live.html
          echo "Confirmed connected workspace, guided builder, counter integration and portal navigation."
          curl --fail --silent --show-error --max-time 25 https://brzoilokalno.com/ -o /tmp/main-platform.html
          test -s /tmp/main-platform.html
          echo "Confirmed public TECH release, creator core, and main-platform availability."
      - name: Verify published content and removal of the old main-domain pages
        env:
          TECH_RELEASE: ${{ steps.source.outputs.commit }}
        run: python3 scripts/test_live_content.py
      - name: Preserve public content verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-public-content-verification
          path: portal-audit-output/live-content-verification.json
          retention-days: 7
